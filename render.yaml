services:
  - type: web
    name: aucto-bidzone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aucto-bidzone-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "https://aucto-bidzone-frontend.onrender.com"

  - type: web
    name: aucto-bidzone-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://aucto-bidzone-api.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://aucto-bidzone-api.onrender.com

databases:
  - name: aucto-bidzone-db
    databaseName: aucto_bidzone
    user: aucto_bidzone
